services:
  db:
    image: postgres:16
    container_name: grid_observatory_db
    environment:
      POSTGRES_DB: grid_observatory
      POSTGRES_USER: grid
      POSTGRES_PASSWORD: grid_dev_password
    ports:
      - "5432:5432"
    volumes:
      - grid_observatory_pgdata:/var/lib/postgresql/data

volumes:
  grid_observatory_pgdata:
